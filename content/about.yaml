story: "I'm a student at Kwame Nkrumah University of Science and Technology (KNUST) in Kumasi, working towards a career as a cybersecurity analyst.\n\nMy path into security started with media. Running live streams and managing equipment for churches and events taught me how systems fail under pressure — and how much depends on the people who keep them running. That curiosity pulled me towards networks, web technology and, eventually, security.\n\nToday I split my time between studying security fundamentals, building web projects and producing photo and video work for organisations across Kumasi. Placeholder copy — Jeffrey to supply the final story."
